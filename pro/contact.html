<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Ria Iyer</title>
<meta name="description" content="Get in touch with Ria Iyer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/pro.css">
</head>
<body>
<a href="index.html" class="p-back"><span>&#8592;</span> Home</a>
<main>
  <div class="wrap section">
    <div class="section-head">
      <h2>Get In Touch</h2>
      <p>Questions, feedback, or opportunities? I'd love to hear from you.</p>
    </div>
    <div class="p-contact-grid">
      <div class="p-panel">
        <form id="p-contact-form" data-endpoint="https://script.google.com/macros/s/AKfycbwsMsE3KjDJUI3Un7IVydlJnyESJClkCC2cjWoAsZqzD02x8FGdnNNM5Iv4jdrS4io/exec">
          <div class="p-form-row">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="p-form-row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="p-form-row">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <div class="p-hp" aria-hidden="true"><label>Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
          <button class="btn" type="submit">Send &#8594;</button>
          <p id="p-form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
      <div class="p-panel">
        <h3 style="margin-top:0;">Direct Connect</h3>
        <p class="prose" style="color:var(--ink-dim); font-size:14.5px;">Reach out by email or LinkedIn, I&#x27;ll get back to you as soon as I can.</p>
        <div class="p-contact-links">
          <a href="mailto:riaiyer2@gmail.com?subject=Hello%20Ria&amp;body=Hi%20Ria%2C%0A%0A">Email &#8594;</a>
          <a href="https://www.linkedin.com/in/ria-iyer/" target="_blank" rel="noopener">LinkedIn &#8594;</a>
        </div>
      </div>
    </div>
  </div>
</main>
