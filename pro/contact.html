      <button class="p-toggle" aria-label="Toggle navigation">Menu</button>
    </div>
  </div>
</header>
<main>
  <div class="wrap section">
    <div class="section-head">
      <h2>Get In Touch</h2>
      <p>Questions, feedback, or opportunities — I'd love to hear from you.</p>
    </div>
    <div class="p-contact-grid">
      <div class="p-panel">
        <form id="p-contact-form">
          <div class="p-form-row">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="p-form-row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="p-form-row">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button class="btn" type="submit">Send &#8594;</button>
          <p id="p-form-status" style="margin-top:14px; font-size:14px; color:var(--ink-dim);"></p>
        </form>
      </div>
      <div class="p-panel">
        <h3 style="margin-top:0;">Direct Connect</h3>
        <p class="prose" style="color:var(--ink-dim); font-size:14.5px;">Prefer email or LinkedIn? Same difference.</p>
        <div class="p-contact-links">
          <a href="mailto:riaiyer2@gmail.com">Email &#8594;</a>
          <a href="https://www.linkedin.com/in/ria-iyer/" target="_blank" rel="noopener">LinkedIn &#8594;</a>
        </div>
      </div>
    </div>
  </div>
