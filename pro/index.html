<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ria Iyer | Product Designer &amp; UX Researcher</title>
<meta name="description" content="Ria Iyer, Product Designer, UX Researcher, and Game Designer. Portfolio of products, prototypes, and research work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/pro.css">
<link rel="prefetch" href="projects.html">
<link rel="prefetch" href="resume.html">
</head>
<body>
<section class="intro">
  <div class="intro-copy">
    <span class="intro-eyebrow">Portfolio 2026</span>
    <h1>Ria <em>Iyer</em></h1>
    <p class="intro-role">Product Designer, UX Researcher &amp; Game Designer.</p>
    <div class="intro-links">
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
  <nav class="cards" aria-label="Main">
      <a class="oc oc-work" href="projects.html"><span class="oc-num">01</span><span class="oc-num oc-num-b">01</span><span class="oc-title">View My Work</span><span class="oc-sub">Products, research &amp; games</span><span class="oc-arrow" aria-hidden="true">&#8594;</span></a>
      <a class="oc oc-resume" href="resume.html"><span class="oc-num">02</span><span class="oc-num oc-num-b">02</span><span class="oc-title">Resume</span><span class="oc-sub">Experience &amp; skills</span><span class="oc-arrow" aria-hidden="true">&#8594;</span></a>
  </nav>
</section>
<script>
(function () {
  document.querySelectorAll('.oc').forEach(function (a) {
    a.addEventListener('click', function (e) {
      if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (document.querySelector('.swipe-train')) { e.preventDefault(); return; }
      e.preventDefault();
      var kind = a.classList.contains('oc-work') ? 'work' : 'resume';
      var n = kind === 'work' ? '01' : '02', t = kind === 'work' ? 'View My Work' : 'Resume';
      var fallback = function () { try { sessionStorage.setItem('swipe', kind); } catch (err) {} window.location.href = a.href; };
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { window.location.href = a.href; return; }
      var d = document.createElement('div');
      d.className = 'swipe-train in ' + kind;
      d.innerHTML = '<div class="swipe-body"></div><div class="swipe-card"><span class="sw-num">' + n + '</span><span class="sw-title">' + t + '</span><span class="sw-arrow">→</span><span class="sw-num sw-num-b">' + n + '</span></div>';
      document.body.appendChild(d);
      // Fetch the next page while the card is already moving, then swap it in under the card without a real page load (no stall).
      var page = fetch(a.href).then(function (r) { if (!r.ok) throw 0; return r.text(); }).catch(function () { return null; });
      var done = false;
      d.addEventListener('animationend', function () {
        if (done) return;
        done = true;
        page.then(function (html) {
          if (!html) { fallback(); return; }
          try {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            document.title = doc.title;
            Array.prototype.slice.call(document.body.children).forEach(function (el) { if (el !== d) el.remove(); });
            Array.prototype.slice.call(doc.body.childNodes).forEach(function (node) {
              if (node.nodeName === 'SCRIPT') {
                if (node.src) { var s = document.createElement('script'); s.src = node.src; document.body.appendChild(s); }
                return;
              }
              document.body.insertBefore(document.importNode(node, true), d);
            });
            window.scrollTo(0, 0);
            history.pushState(null, '', a.href);
            d.className = 'swipe-train out ' + kind;
            d.addEventListener('animationend', function () { d.remove(); });
          } catch (err) { fallback(); }
        });
      });
    });
  });
  window.addEventListener('popstate', function () { window.location.reload(); });
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) document.querySelectorAll('.swipe-train').forEach(function (n) { n.remove(); });
  });
})();
</script>
</body>
</html>
