<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ria Iyer — Choose Your Experience</title>
<meta name="description" content="Ria Iyer — Product Designer, UX Researcher, and Game Designer. Choose the professional or game-mode experience.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pro-bg:#FAFAF8; --pro-ink:#17171A; --pro-dim:#6B6B70; --pro-accent:#3452E0;
    --game-bg:#0d0b1a; --game-cyan:#4CE0E0; --game-pink:#ff4fa3; --game-yellow:#ffd54f;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{ font-family:'Inter',sans-serif; }
  .chooser{ position:relative; height:100vh; width:100vw; display:flex; }
  .panel{
    position:relative; flex:1; display:flex; align-items:center; justify-content:center;
    overflow:hidden; cursor:pointer; text-decoration:none;
    transition:flex .45s cubic-bezier(.6,0,.2,1);
  }
  .chooser:has(.panel:hover) .panel:not(:hover){ flex:0.8; }
  .chooser:has(.panel:hover) .panel:hover{ flex:1.3; }

  .panel-pro{ background:var(--pro-bg); color:var(--pro-ink); }
  .panel-game{
    background:var(--game-bg); color:#fff;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size:28px 28px;
  }

  .panel-inner{ text-align:center; padding:24px; max-width:420px; }
  .panel-eyebrow{ font-size:12.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; margin-bottom:14px; display:block; }
  .panel-pro .panel-eyebrow{ color:var(--pro-accent); }
  .panel-game .panel-eyebrow{ font-family:'Press Start 2P',monospace; font-size:9px; color:var(--game-yellow); letter-spacing:.05em; text-shadow:2px 2px 0 #000; }

  .panel-title{ font-weight:800; letter-spacing:-.02em; margin:0 0 14px; }
  .panel-pro .panel-title{ font-size:clamp(28px,4vw,44px); }
  .panel-game .panel-title{ font-family:'Press Start 2P',monospace; font-size:clamp(16px,2.4vw,26px); text-shadow:3px 3px 0 #000; color:var(--game-cyan); line-height:1.4; }

  .panel-desc{ margin:0 0 26px; font-size:15px; line-height:1.6; }
  .panel-pro .panel-desc{ color:var(--pro-dim); }
  .panel-game .panel-desc{ font-size:13px; color:#c9c4e8; }

  .panel-cta{
    display:inline-flex; align-items:center; justify-content:center;
    font-weight:600; font-size:14.5px;
    padding:14px 28px; border-radius:8px; min-width:220px;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .panel-pro .panel-cta{ background:var(--pro-accent); color:#fff; }
  .panel-game .panel-cta{
    font-family:'Press Start 2P',monospace; font-size:11px;
    background:var(--game-pink); color:#0d0b1a;
  }

  .center-label{
    position:absolute; top:24px; left:50%; transform:translateX(-50%);
    z-index:3; text-align:center; pointer-events:none;
  }
  .center-label h1{ margin:0; font-size:14px; font-weight:700; letter-spacing:.06em; color:#888; text-transform:uppercase; }

  @media (max-width:760px){
    body{ overflow-y:auto; }
    .chooser{ flex-direction:column; height:auto; min-height:100vh; }
    .chooser:has(.panel:hover) .panel:not(:hover){ flex:1; }
    .chooser:has(.panel:hover) .panel:hover{ flex:1; }
    .panel{ min-height:50vh; flex:none !important; }
  }
</style>
</head>
<body>

<div class="center-label"><h1>Choose Your Experience</h1></div>

<div class="chooser">
  <a class="panel panel-pro" href="pro/index.html">
    <div class="panel-inner">
      <h2 class="panel-title">Professional</h2>
      <p class="panel-desc">A clean, industry-standard look at my product design, UX research, and case study work.</p>
      <span class="panel-cta">Enter Professional Site</span>
    </div>
  </a>
  <a class="panel panel-game" href="game/index.html">
    <div class="panel-inner">
      <span class="panel-eyebrow">Press Start</span>
      <h2 class="panel-title">Game Mode</h2>
      <p class="panel-desc">The full arcade experience — pixel art, retro UI, and the same projects with a lot more personality.</p>
      <span class="panel-cta">Start Game</span>
    </div>
  </a>
</div>

</body>
</html>
